<div class="container mt-4">

  <h2 class="mb-4 text-primary">Admin Dashboard</h2>

  <div class="row">

    <!-- Total Employees -->
    <div class="col-md-4">
      <div class="card shadow border-0 text-center p-3">
        <h5>Total Employees</h5>
        <h2 class="text-success">{{ totalEmployees }}</h2>
      </div>
    </div>

    <!-- Total Salary -->
    <div class="col-md-4">
      <div class="card shadow border-0 text-center p-3">
        <h5>Total Salary Expense</h5>
        <h2 class="text-danger">₹ {{ totalSalary }}</h2>
      </div>
    </div>

    <!-- Departments -->
    <div class="col-md-4">
      <div class="card shadow border-0 text-center p-3">
        <h5>Total Departments</h5>
        <h2 class="text-info">{{ totalDepartments }}</h2>
      </div>
    </div>

  </div>

</div>
