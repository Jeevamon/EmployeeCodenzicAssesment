<div style="display:flex; justify-content:center; align-items:center; height:100vh; background:linear-gradient(135deg,#4e73df,#1cc88a);">

  <div style="background:white; padding:40px; border-radius:15px; width:350px; box-shadow:0 10px 30px rgba(0,0,0,0.2);">

    <h2 style="text-align:center; margin-bottom:20px;">Employee Login</h2>

    <form (ngSubmit)="login()">

      <input type="text" placeholder="Username"
        [(ngModel)]="username"
        name="username"
        required
        style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px; border:1px solid #ccc;">

      <input type="password" placeholder="Password"
        [(ngModel)]="password"
        name="password"
        required
        style="width:100%; padding:10px; margin-bottom:20px; border-radius:8px; border:1px solid #ccc;">

      <button type="submit"
        style="width:100%; padding:10px; border:none; border-radius:8px; background-color:#4e73df; color:white; font-weight:bold;">
        Login
      </button>

    </form>

  </div>
</div>
